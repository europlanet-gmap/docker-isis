          set +a

      - name: Build Matisse-GISPy Image
        run: docker compose build $SERVICE

      - name: Tag Image (Push Event)
        if: ${{ github.event_name == 'push' }}
        run: |
          NEW_IMAGE=$(docker compose config --images $SERVICE)
          docker tag $NEW_IMAGE $REPO:$GITHUB_REF_NAME

      - name: Tag Image as Latest (Tag Event)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          NEW_IMAGE=$(docker compose config --images $SERVICE)
          docker tag $NEW_IMAGE $REPO:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Matisse-GISPy Image
        run: |
          docker image ls | tail -n+2 | awk '{print $1":"$2}' | grep "$REPO" | xargs -I'{}' docker push {}

  #########################################
  # Job: Build and Publish Fortran Image
  #########################################
  fortran:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dockerfiles
    env:
      SERVICE: jupyter-fortran
      REPO: ${{ vars.DOCKERHUB_NAMESPACE }}/jupyter-fortran
    steps:
      - name: Checkout Code
