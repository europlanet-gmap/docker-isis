  #########################################
  # Job: Build and Publish Grass-GISPy Image
  #########################################
  grass-gispy:    
    needs: grass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dockerfiles
    env:
      USER_ORG: ${{ vars.DOCKERHUB_NAMESPACE }}
      SERVICE: jupyter-grass-gispy
      REPO: ${{ vars.DOCKERHUB_NAMESPACE }}/jupyter-grass-gispy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Environment Variables
        run: |
          set -a
          source .env
          set +a          

      - name: List Docker Images
        run: docker image ls -a

      - name: Build GRASS-GISpy Image
        run: |
          GRASS_IMAGE=${{ vars.DOCKERHUB_NAMESPACE }}/jupyter-grass:${GITHUB_REF_NAME}
          docker compose build --build-arg BASE_IMAGE=${GRASS_IMAGE} $SERVICE

      - name: Tag Image (Push Event)
        if: ${{ github.event_name == 'push' }}
        run: |
          NEW_IMAGE=$(docker compose config --images $SERVICE | head -n 1 | xargs)
          echo "Tagging image: '$NEW_IMAGE' as $REPO:$GITHUB_REF_NAME"
          docker tag "$NEW_IMAGE" "$REPO:$GITHUB_REF_NAME"

      - name: Tag Image as Latest and Versioned (Tag Event)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          NEW_IMAGE=$(docker compose config --images $SERVICE | head -n 1 | xargs)
          echo "Tagging image: '$NEW_IMAGE' as $REPO:latest"
          docker tag "$NEW_IMAGE" "$REPO:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push GRASS-GISpy Image
        run: |
          docker image ls | tail -n+2 | awk '{print $1":"$2}' | grep "$REPO" | xargs -I'{}' docker push {}

      - name: List Docker Images
        run: docker image ls -a
