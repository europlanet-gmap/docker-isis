      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Matisse Image
        run: |
          docker image ls | tail -n+2 | awk '{print $1":"$2}' | grep "$REPO" | xargs -I'{}' docker push {}

  #########################################
  # Job: Build and Publish Matisse-GISPy Image
  #########################################
  matisse-gispy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dockerfiles
    env:
      SERVICE: jupyter-matisse-gispy
      REPO: ${{ vars.DOCKERHUB_NAMESPACE }}/jupyter-matisse-gispy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Load Environment Variables
        run: |
          set -a
