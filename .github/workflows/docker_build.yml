      - name: Push Fortran Image
        run: |
          docker image ls | tail -n+2 | awk '{print $1":"$2}' | grep "$REPO" | xargs -I'{}' docker push {}

  #########################################
  # Job: Build and Publish Grass Image
  #########################################
  grass:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dockerfiles
    env:
      USER_ORG: ${{ vars.DOCKERHUB_NAMESPACE }}
      SERVICE: jupyter-grass
      REPO: ${{ vars.DOCKERHUB_NAMESPACE }}/jupyter-grass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Environment Variables
        run: |
          set -a
          source .env
          set +a

      - name: Build GRASS Image
        run: docker compose build $SERVICE

      - name: Tag Image (Push Event)
        if: ${{ github.event_name == 'push' }}
        run: |
          NEW_IMAGE=$(docker compose config --images $SERVICE)
          docker tag $NEW_IMAGE $REPO:$GITHUB_REF_NAME

      - name: Tag Image as Latest (Tag Event)
